name: Request a model
description: Suggest a medical imaging model to port to MedMLX for Apple Silicon.
title: "[Model request]: "
labels: [model-request, needs-review]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a model you would like to run locally on your Mac with MedMLX.
        Check the [model catalog](https://medmlx.org/models/) and [existing requests](https://github.com/MedMLX/.github/issues?q=is%3Aissue%20label%3Amodel-request) first. If there is already a request, add your use case to that thread.
        Requests help us assess useful ports; they do not guarantee implementation or a release date.

  - type: input
    id: model-name
    attributes:
      label: Model name
      description: Include the variant or version, if relevant.
    validations:
      required: true

  - type: textarea
    id: model-source
    attributes:
      label: Repository or paper
      description: Link to the original model's code, paper, or model card so we can identify it.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Research use case
      description: What would you use this model for? Include the imaging modality, task, and expected output.
    validations:
      required: true

  - type: textarea
    id: weights-license
    attributes:
      label: Weights and license
      description: Link to pretrained weights and the code and weight licenses, if known. Mention any access restrictions.

  - type: input
    id: hardware
    attributes:
      label: Mac and memory
      description: Optional. Which Apple Silicon chip and how much unified memory would you use?
      placeholder: For example, M4 Pro with 48 GB

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional. Share relevant benchmarks or related ports.
